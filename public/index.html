<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheater</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-phase="join">

  <header class="app-header">
    <h1>Cheater</h1>
    <p class="subtitle">Bid or bluff. First to zero dice wins.</p>
    <p id="spectator-count-display" class="hint" hidden></p>
  </header>

  <main>
    <!-- JOIN / CREATE -->
    <section id="view-join" class="view">
      <label>
        Your name
        <input id="name-input" type="text" maxlength="24" placeholder="Your name" autocomplete="off">
      </label>

      <div class="join-actions">
        <button id="create-room-btn" class="primary">Create room</button>

        <div class="divider">or</div>

        <label>
          Room code
          <input id="room-code-input" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" style="text-transform:uppercase">
        </label>
        <button id="join-room-btn">Join room</button>
        <button id="spectate-btn">Watch as spectator</button>
      </div>

      <p id="join-error" class="error-text" hidden></p>
    </section>

    <!-- LOBBY -->
    <section id="view-lobby" class="view">
      <h2>Room <span id="lobby-room-code"></span></h2>
      <p class="hint">Share this code with other players.</p>
      <ul id="lobby-player-list" class="player-list"></ul>
      <button id="start-game-btn" class="primary" hidden>Start game</button>
      <p id="lobby-waiting-text" class="hint">Waiting for the host to start&hellip;</p>
    </section>

    <!-- GAME -->
    <section id="view-game" class="view">
      <div id="game-table" class="game-table"></div>

      <div class="your-dice">
        <span class="hint">Your dice</span>
        <div id="your-dice" class="dice-row"></div>
      </div>

      <div id="bid-controls" class="bid-controls" hidden>
        <div class="bid-field">
          <span class="hint">Face</span>
          <div id="face-picker" class="face-picker"></div>
        </div>
        <div class="bid-field">
          <span class="hint">Number of dice</span>
          <select id="bid-quantity"></select>
        </div>
        <button id="place-bid-btn" class="primary">Bid</button>
        <button id="challenge-btn" class="danger" disabled>Call cheat!</button>
      </div>

      <p id="game-error" class="error-text" hidden></p>
    </section>

    <!-- GAME OVER -->
    <section id="view-gameover" class="view">
      <h2 id="gameover-title">Game over</h2>
      <p id="gameover-text"></p>
      <button id="play-again-btn" class="primary">Reload &amp; play again</button>
    </section>
  </main>

  <script src="client.js"></script>
</body>
</html>
